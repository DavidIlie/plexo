name: plexo:nextjs
on:
    pull_request:
        paths-ignore:
            - "**/*.md"
            - "docs/**"
    push:
        branches:
            - master
        paths-ignore:
            - "**/*.md"
            - "docs/**"

# Supersede stale pull request runs; let every master build finish.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    execute:
        name: Lint, typecheck and build
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
            IMAGE: ghcr.io/davidilie/plexo
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            # next-env.d.ts and the route and cacheLife types are generated, not committed.
            - run: pnpm exec next typegen
            - run: pnpm lint
            - run: pnpm typecheck

            # Pull requests stop here; master builds and publishes the image.
            # The image build skips Next's own typecheck because it ran above.
            - name: Generate build ID
              if: github.event_name == 'push'
              id: prep
              run: |
                  branch=${GITHUB_REF##*/}
                  sha=${GITHUB_SHA::8}
                  ts=$(date +%s)
                  echo "BUILD_ID=${branch}-${sha}-${ts}" >> "$GITHUB_OUTPUT"
                  echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            - name: Login to GitHub Container Registry
              if: github.event_name == 'push'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: DavidIlie
                  password: ${{ secrets.TOKEN }}
            - if: github.event_name == 'push'
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build and publish container image with tag
              if: github.event_name == 'push'
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  push: true
                  context: .
                  build-args: |
                      NEXT_PUBLIC_VERSION=${{ steps.prep.outputs.SHORT_SHA }}
                  tags: |
                      ${{ env.IMAGE }}:${{ steps.prep.outputs.BUILD_ID }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
