name: plexo:nextjs
on:
    pull_request:
    push:
        branches:
            - master

jobs:
    check:
        name: Lint and typecheck
        # Self-hosted runner: don't run code from fork pull requests on it.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: davidapps-ubuntu
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            # next-env.d.ts and the route and cacheLife types are generated, not committed.
            - run: pnpm exec next typegen
            - run: pnpm lint
            - run: pnpm typecheck

    execute:
        needs: check
        if: github.event_name == 'push'
        env:
            IMAGE: ghcr.io/davidilie/plexo
        runs-on: davidapps-ubuntu
        steps:
            - name: Generate build ID
              id: prep
              run: |
                  branch=${GITHUB_REF##*/}
                  sha=${GITHUB_SHA::8}
                  ts=$(date +%s)
                  echo "BUILD_ID=${branch}-${sha}-${ts}" >> "$GITHUB_OUTPUT"
                  echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            - name: "Build:checkout"
              uses: actions/checkout@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: DavidIlie
                  password: ${{ secrets.TOKEN }}
            - name: Build and publish container image with tag
              uses: docker/build-push-action@v5
              with:
                  push: true
                  context: .
                  cache-from: type=gha,scope=plexo
                  cache-to: type=gha,mode=max,scope=plexo
                  build-args: |
                      NEXT_PUBLIC_VERSION=${{ steps.prep.outputs.SHORT_SHA }}
                  tags: |
                      ${{ env.IMAGE }}:${{ steps.prep.outputs.BUILD_ID }}
