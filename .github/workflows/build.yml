name: plexo:nextjs
on:
    push:
        branches:
            - master

jobs:
    execute:
        env:
            IMAGE: ghcr.io/davidilie/plexo
        runs-on: ubuntu-latest
        steps:
            - name: Generate build ID
              id: prep
              run: |
                  branch=${GITHUB_REF##*/}
                  sha=${GITHUB_SHA::8}
                  ts=$(date +%s)
                  echo "BUILD_ID=${branch}-${sha}-${ts}" >> "$GITHUB_OUTPUT"
                  echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            - name: "Build:checkout"
              uses: actions/checkout@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            # The gha layer cache (cache-from/cache-to on build-push-action)
            # does NOT export RUN --mount=type=cache contents. cache-dance
            # injects/extracts the pnpm store and the Turbopack FileSystem
            # cache (.next/cache) into those mounts, persisted via actions/cache.
            - name: Cache BuildKit mount sources
              id: mount-cache
              uses: actions/cache@v4
              with:
                  path: |
                      pnpm-store-cache
                      next-cache
                  key: buildkit-mounts-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
                  restore-keys: |
                      buildkit-mounts-${{ hashFiles('pnpm-lock.yaml') }}-
                      buildkit-mounts-
            - name: Inject BuildKit cache mounts
              uses: reproducible-containers/buildkit-cache-dance@v3.4.0
              with:
                  cache-map: |
                      {
                        "pnpm-store-cache": {
                          "target": "/pnpm/store",
                          "id": "pnpm-store"
                        },
                        "next-cache": {
                          "target": "/home/node/app/.next/cache",
                          "id": "next-cache"
                        }
                      }
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: DavidIlie
                  password: ${{ secrets.TOKEN }}
            - name: Build and publish container image with tag
              uses: docker/build-push-action@v5
              with:
                  push: true
                  context: .
                  build-args: |
                      NEXT_PUBLIC_VERSION=${{ steps.prep.outputs.SHORT_SHA }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  tags: |
                      ${{ env.IMAGE }}:${{ steps.prep.outputs.BUILD_ID }}
